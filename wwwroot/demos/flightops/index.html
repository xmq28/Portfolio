<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FlightOps Executive - flight operations monitoring demo with dummy data">
    <title>FlightOps Executive</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1.8v2.4M12 19.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 22 20.5H2z"/><path d="M12 9.5v5M12 17.4h.01"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 6 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-6-3.9-9S9.4 5.8 12 3z"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 18l4.2-5.4"/><circle cx="12" cy="18" r="1.3"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><path d="M4.4 16.4a9 9 0 1 1 15.2 0"/><path d="M8 15a5 5 0 0 1 8 0"/><circle cx="12" cy="14.5" r="1.4"/><path d="M12 14.5 19 6"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><path d="M8 18.5h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c.6-3.4 3.1-5.4 6.2-5.4s5.6 2 6.2 5.4"/><path d="M16.2 5.1a3.4 3.4 0 0 1 0 6.6M17.6 14.9c2.2.6 3.6 2.4 4 5.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.2 15.2 21 21"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.2h5v2.3M6.5 6.5 7.4 21h9.2l.9-14.5M10 10.5v6.5M14 10.5v6.5"/></symbol>
    <symbol id="i-broadcast" viewBox="0 0 24 24"><circle cx="12" cy="9" r="2.2"/><path d="M8.1 5.1a5.5 5.5 0 0 0 0 7.8M15.9 5.1a5.5 5.5 0 0 1 0 7.8M5.3 2.3a9.5 9.5 0 0 0 0 13.4M18.7 2.3a9.5 9.5 0 0 1 0 13.4M12 11.2 10.5 22h3z"/></symbol>

    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H14M17 8.5l3.5 3.5L17 15.5M20 12H10"/></symbol>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
    <a class="navbar-brand" href="#/dashboard">
        <svg class="ico ico-lg text-info"><use href="#i-plane"></use></svg>
        <span>FlightOps <span class="text-info">Executive</span></span>
    </a>

    <div class="nav-links">
        <a class="nav-link" data-route="dashboard" href="#/dashboard"><svg class="ico"><use href="#i-chart"></use></svg> Dashboard</a>
        <a class="nav-link" data-route="flights" href="#/flights"><svg class="ico"><use href="#i-list"></use></svg> Flights</a>
        <a class="nav-link" data-route="track" href="#/track"><svg class="ico"><use href="#i-target"></use></svg> Track</a>
        <a class="nav-link nav-admin" data-route="admin" href="#/admin"><svg class="ico"><use href="#i-shield"></use></svg> Admin</a>
    </div>

    <div class="nav-actions">
        <a class="portfolio-link" href="/#projects">Back to portfolio</a>
        <button id="darkModeToggle" class="theme-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg class="ico ico-md"><use href="#i-moon"></use></svg>
        </button>
        <div class="user-chip">
            <svg class="ico"><use href="#i-user"></use></svg>
            <span>admin</span>
            <span class="badge badge-info">Admin</span>
        </div>
    </div>
</nav>

<!-- ================= GLOBAL ALERT BAR ================= -->
<div id="alertsContainer" class="alert-bar" style="display:none;">
    <div class="alert-bar-inner">
        <div id="alertsMessage" class="alert-bar-text"></div>
        <span class="badge badge-danger">Critical Ops Alert</span>
    </div>
</div>

<!-- ================= CONTENT ================= -->
<main class="container" id="app"></main>

<footer>
    <span id="footerYear"></span> FlightOps &ndash; Flight Operations Monitoring System &middot; offline portfolio demo with dummy data
</footer>

<!-- ================= MODALS ================= -->
<div class="modal" id="alertsModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
        <div class="modal-header modal-header-warning">
            <h5><svg class="ico text-danger"><use href="#i-alert"></use></svg> Active Disruptions</h5>
            <button class="icon-button" data-close-modal aria-label="Close"><svg class="ico"><use href="#i-close"></use></svg></button>
        </div>
        <div class="modal-body" id="alertsDetails"></div>
    </div>
</div>

<div class="modal" id="opsModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel modal-console" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h5 class="text-info"><svg class="ico"><use href="#i-tower"></use></svg> OPERATIONS CONSOLE</h5>
            <button class="icon-button" data-close-modal aria-label="Close"><svg class="ico"><use href="#i-close"></use></svg></button>
        </div>
        <div class="modal-body">
            <div class="ops-actions">
                <button class="btn btn-outline-danger btn-tall" data-sim="CANCEL"><svg class="ico ico-lg"><use href="#i-ban"></use></svg><span>Force Cancellation</span></button>
                <button class="btn btn-outline-warning btn-tall" data-sim="DELAY"><svg class="ico ico-lg"><use href="#i-clock"></use></svg><span>Inject Massive Delay</span></button>
                <button class="btn btn-outline-info btn-tall" data-sim="RESET"><svg class="ico ico-lg"><use href="#i-undo"></use></svg><span>Reset Simulation</span></button>
            </div>
            <div class="ops-log-wrap">
                <h6>Ops Console Output</h6>
                <pre id="opsLog">[SYS] Ready for command input...</pre>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="formModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h5 id="formModalTitle">Form</h5>
            <button class="icon-button" data-close-modal aria-label="Close"><svg class="ico"><use href="#i-close"></use></svg></button>
        </div>
        <div class="modal-body" id="formModalBody"></div>
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
